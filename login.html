<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Radharani Salon</title>

    <link rel="stylesheet" href="beauty.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
        }

        footer {
            margin-top: auto;
        }

        .login-container {
            width: 320px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .input-box {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-box input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .password-box {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #c2185b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .error {
            color: red;
            display: none;
            font-size: 12px;
        }

        .extra {
            margin-top: 10px;
            font-size: 13px;
        }

        .extra a {
            color: #c2185b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h2 class="logo">💖 Radharani</h2>
</nav>

<div class="main-content">

    <div class="login-container">
        <h2>Login</h2>

        <form id="loginForm">

            <div class="input-box">
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box password-box">
                <input type="password" id="password" placeholder="Enter your password" required>
                <span class="toggle-eye" onclick="togglePassword()">👁</span>
            </div>

            <p class="error" id="errorMsg">Invalid Email or Password</p>

            <button type="submit" class="login-btn">Login</button>

            <div class="extra">
                <p>Don't have account? <a href="signup.html">Sign Up</a></p>
            </div>

        </form>
    </div>

</div>

<footer>
    © 2026 Radharani Salon • Designed with Vedika ♥
</footer>

<script>
// 👁 Toggle Password
function togglePassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

// 🚀 LOGIN WITH BACKEND + FINAL FIX
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: "",
            email: email,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {

            // ✅ SAVE ROLE
            localStorage.setItem("role", "admin");

            // ✅ DEBUG
            console.log("Role Saved:", localStorage.getItem("role"));

            alert("Welcome " + data.name);

            // ✅ YOUR REQUIRED FIX
            console.log("Redirecting to admin...");
            window.location.href = "beauty.html";

        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    })
    .catch(error => {
        console.error("Error:", error);
        document.getElementById("errorMsg").innerText = "Server error!";
        document.getElementById("errorMsg").style.display = "block";
    });
});
</script>

</body>
</html>
