<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | Radharani Salon</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f8f0f5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* HEADER */
header {
    background: #c2185b;
    color: white;
    padding: 15px;
    text-align: center;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BOX */
.payment-box {
    width: 400px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    color: #c2185b;
}

/* TABS */
.tabs {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.tabs button {
    width: 48%;
    padding: 8px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    background: #eee;
}

.tabs button.active {
    background: #c2185b;
    color: white;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* BUTTON */
.pay-btn {
    width: 100%;
    padding: 10px;
    background: #c2185b;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.pay-btn:hover {
    box-shadow: 0 0 10px #c2185b;
}

/* SUCCESS */
.success {
    display: none;
    text-align: center;
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    💖 Radharani Salon Payment Gateway
</header>

<div class="main">

<div class="payment-box">

    <h2>Complete Payment</h2>

    <!-- Tabs -->
    <div class="tabs">
        <button class="active" onclick="showCard()">Card</button>
        <button onclick="showUPI()">UPI</button>
    </div>

    <!-- CARD FORM -->
    <div id="cardForm">
        <input type="text" placeholder="Card Holder Name">
        <input type="text" placeholder="Card Number">
        <input type="text" placeholder="Expiry Date (MM/YY)">
        <input type="password" placeholder="CVV">
    </div>

    <!-- UPI FORM -->
    <div id="upiForm" style="display:none;">
        <input type="text" placeholder="Enter UPI ID (example@upi)">
    </div>

    <button class="pay-btn" onclick="payNow()">Pay Now</button>

    <p class="success" id="successMsg">
        🎉 Payment Successful! Your booking is confirmed.
    </p>

</div>

</div>

<script>
function showCard() {
    document.getElementById("cardForm").style.display = "block";
    document.getElementById("upiForm").style.display = "none";
}

function showUPI() {
    document.getElementById("cardForm").style.display = "none";
    document.getElementById("upiForm").style.display = "block";
}

function payNow() {
    document.getElementById("successMsg").style.display = "block";

    setTimeout(() => {
        alert("Redirecting to Home...");
        window.location.href = "beauty.html";
    }, 2000);
}
</script>

</body>
</html>
