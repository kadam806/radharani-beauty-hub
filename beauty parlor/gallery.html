<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery | Radharani Salon</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f0c1d,#1b1033);
    color:#fff;
}



/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 50px;
    background:rgba(0,0,0,0.6);
}
.navbar a{
    color:#fff;
    text-decoration:none;
    margin-left:20px;
}

/* TITLE */
.title{
    text-align:center;
    margin:40px;
    font-size:40px;
    background:linear-gradient(135deg,#ff5fa2,#ffb3ec);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* FILTER */
.filters{
    text-align:center;
    margin-bottom:20px;
}
.filters button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:20px;
    background:#ff5fa2;
    color:#fff;
    cursor:pointer;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px 40px;
}

/* IMAGE CARD */
.img-card{
    position:relative;
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
}
.img-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    transition:0.5s;
}
.img-card:hover img{
    transform:scale(1.1);
}

/* OVERLAY */
.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    text-align:center;
    padding:10px;
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
}
.lightbox img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>💖 Radharani</h2>
    <div>
        <a href="beauty.html">Home</a>
        <a href="services.html">Services</a>
        <a href="packages.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="ContactUs.html">Contact Us</a>
        <a href="AboutUs.html">About Us</a>
    </div>
</div>

<h1 class="title">Our Beauty Gallery</h1>



<div class="gallery">

    <!-- BRIDAL (4) -->
    <div class="img-card" data-category="bridal" onclick="openImage(this)">
        <img src="brr.jpg"><div class="overlay">Bridal Makeup</div>
    </div>

    <div class="img-card" data-category="bridal" onclick="openImage(this)">
        <img src="airr.jpg"><div class="overlay">Airbrush Look</div>
    </div>

    <div class="img-card" data-category="bridal" onclick="openImage(this)">
        <img src="hdd.jpg"><div class="overlay">HD Makeup</div>
    </div>

    <div class="img-card" data-category="bridal" onclick="openImage(this)">
        <img src="engages.webp"><div class="overlay">Engagement Look</div>
    </div>

    <!-- HAIR (4) -->
    <div class="img-card" data-category="hair" onclick="openImage(this)">
        <img src="hair1.jpg"><div class="overlay">Hair Styling</div>
    </div>

    <div class="img-card" data-category="hair" onclick="openImage(this)">
        <img src="hairs3.avif"><div class="overlay">Hair Spa</div>
    </div>

    <div class="img-card" data-category="hair" onclick="openImage(this)">
        <img src="hairs4.jpg"><div class="overlay">Hair Coloring</div>
    </div>

    <div class="img-card" data-category="hair" onclick="openImage(this)">
        <img src="hairs5.jpg"><div class="overlay">Hair Treatment</div>
    </div>

    <!-- SKIN (4) -->
    <div class="img-card" data-category="skin" onclick="openImage(this)">
        <img src="facials.jpg"><div class="overlay">Facial</div>
    </div>

    <div class="img-card" data-category="skin" onclick="openImage(this)">
        <img src="waxing.jpg"><div class="overlay">Waxing</div>
    </div>

    <div class="img-card" data-category="skin" onclick="openImage(this)">
        <img src="care.webp"><div class="overlay">Skin Care</div>
    </div>

    <div class="img-card" data-category="skin" onclick="openImage(this)">
        <img src="glow.webp"><div class="overlay">Glow Treatment</div>
    </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeImage()">
    <img id="lightboxImg">
</div>

<script>
function filterGallery(category){
    const items = document.querySelectorAll(".img-card");

    items.forEach(item => {
        if(category === "all" || item.dataset.category === category){
            item.style.display = "block";
        } else {
            item.style.display = "none";
        }
    });
}

function openImage(element){
    const imgSrc = element.querySelector("img").src;
    document.getElementById("lightboxImg").src = imgSrc;
    document.getElementById("lightbox").style.display = "flex";
}

function closeImage(){
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
