<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Radharani Salon</title>

    <link rel="stylesheet" href="beauty.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
        }

        footer {
            margin-top: auto;
        }

        .signup-container {
            width: 340px;
            margin: 70px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .input-box {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-box input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        .input-box input:focus {
            border-color: #c2185b;
        }

        .password-box {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
        }

        .signup-btn {
            width: 100%;
            padding: 10px;
            background: #c2185b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .signup-btn:hover {
            box-shadow: 0 0 10px #c2185b;
        }

        .error {
            color: red;
            font-size: 12px;
            display: none;
        }

        .extra {
            margin-top: 10px;
            font-size: 13px;
        }

        .extra a {
            color: #c2185b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h2 class="logo">💖 Radharani</h2>
</nav>

<div class="main-content">

    <div class="signup-container">
        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="input-box">
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="input-box">
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box password-box">
                <input type="password" id="password" placeholder="Create password" required>
                <span class="toggle-eye" onclick="togglePassword('password')">👁</span>
            </div>

            <div class="input-box password-box">
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <span class="toggle-eye" onclick="togglePassword('confirmPassword')">👁</span>
            </div>

            <p class="error" id="errorMsg">Passwords do not match</p>

            <button type="submit" class="signup-btn">Sign Up</button>

            <div class="extra">
                <p>Already have account? <a href="login.html">Login</a></p>
            </div>

        </form>
    </div>

</div>

<footer>
    © 2026 Radharani Salon • Designed with Vedika ♥
</footer>

<script>
// 👁 Toggle password
function togglePassword(id) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

// 🚀 SIGNUP WITH DEBUG + BACKEND
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // ✅ Password check
    if (password !== confirmPassword) {
        document.getElementById("errorMsg").style.display = "block";
        return;
    }

    // 🔥 DEBUG LOG
    console.log("Sending Data:", { name, email, password });

    fetch("http://127.0.0.1:8000/signup", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            email: email,
            password: password
        })
    })
    .then(response => {
        console.log("Response status:", response.status);
        return response.json();
    })
    .then(data => {
        console.log("Backend Response:", data);

        if (data.status === "success") {
            alert("Signup Successful!");
            window.location.href = "login.html";
        } 
        else if (data.status === "exists") {
            alert("User already exists!");
        } 
        else {
            alert("Signup failed!");
        }
    })
    .catch(error => {
        console.error("Error:", error);
        alert("❌ Cannot connect to server");
    });
});
</script>

</body>
</html>
